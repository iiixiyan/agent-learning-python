            ]},
        ];

        let currentArticle = null;
        // 应用基础路径（解决无尾部斜杠时相对路径解析错误的问题）
        const basePath = (function() {
            const p = window.location.pathname;
            return p.endsWith('/') ? p : p + '/';
        })();

        // 渲染目录树
        function renderTree(filter = '') {
            const tree = document.getElementById('articleTree');
            let html = '';
            articles.forEach((stage, sIdx) => {
                const filteredItems = stage.items.filter(item => 
                    item.title.toLowerCase().includes(filter.toLowerCase()) ||
                    item.num.toString().includes(filter)
                );
                if (filter && filteredItems.length === 0) return;
                html += `<div class="stage-group" data-stage="${sIdx}">`;
                html += `<div class="stage-title" onclick="toggleStage(${sIdx})">`;
                html += `<span>${stage.stage}</span><span class="arrow">▼</span></div>`;
                html += `<ul class="article-list">`;
                filteredItems.forEach(item => {
                    const active = currentArticle && currentArticle.num === item.num ? 'active' : '';
                    const status = item.done ? '<span class="status done">已完成</span>' : '<span class="status todo">待补充</span>';
                    html += `<li class="article-item ${active}" onclick="loadArticle('${item.path}', ${item.num})">`;
                    html += `${item.num}. ${item.title}${status}</li>`;
                });
                html += `</ul></div>`;
            });
            tree.innerHTML = html;
        }

        function toggleStage(idx) {
            const group = document.querySelector(`.stage-group[data-stage="${idx}"]`);
            group.classList.toggle('collapsed');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function searchArticles() {
            const query = document.getElementById('searchInput').value;
            renderTree(query);
        }

        // 全部展开
        function expandAll() {
            document.querySelectorAll('.stage-group').forEach(group => {
                group.classList.remove('collapsed');
            });
        }

        // 全部折叠
        function collapseAll() {
            document.querySelectorAll('.stage-group').forEach(group => {
                group.classList.add('collapsed');
            });
        }

        // 回到顶部
        function scrollToTop() {
            document.getElementById('content').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 阅读进度条 + 回到顶部按钮显示
        document.getElementById('content').addEventListener('scroll', function() {
            const content = this;
            const scrollTop = content.scrollTop;
            const scrollHeight = content.scrollHeight - content.clientHeight;
            const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            document.getElementById('progressBar').style.width = progress + '%';

            const backToTop = document.getElementById('backToTop');
            if (scrollTop > 300) {
                backToTop.classList.add('show');
            } else {
                backToTop.classList.remove('show');
            }
        });

        // 加载文章
        async function loadArticle(path, num) {
            currentArticle = { num, path };
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            // 修复 event 兼容性：使用 currentTarget 或 closest 查找
            const activeEl = (event && event.target) ? event.target.closest('.article-item') : document.querySelector(`.article-item[onclick*="${num}"]`);
            if (activeEl) activeEl.classList.add('active');

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:16px;">加载中...</p></div>';

            try {
                // 修复：对包含中文的路径进行 URL 编码
                const fullUrl = encodeURI(basePath + path);
                const resp = await fetch(fullUrl);
                if (!resp.ok) throw new Error('文件不存在 (HTTP ' + resp.status + ')');
                const md = await resp.text();

                // 修正图片路径（使用绝对路径，并对中文路径进行编码）
                let processedMd = md.replace(/\.\.\/IMG\/([^\s\)]+)/g, function(match, imgPath) {
                    return encodeURI(basePath + 'IMG/' + imgPath);
                });
                
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                const html = marked.parse(processedMd);
                content.innerHTML = `<div class="article-content">${html}</div>`;
                
                // 代码高亮
                content.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
                
                // 滚动到顶部
                content.scrollTop = 0;
            } catch (err) {
                content.innerHTML = `<div class="welcome"><h2>📝 文章待补充</h2><p>该文章内容正在编写中，敬请期待！</p><p style="color:#aaa;margin-top:20px;">错误: ${err.message}</p></div>`;
            }
        }

        // 初始化
        renderTree();
    </script>
